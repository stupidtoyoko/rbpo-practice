stages:
  - build
  - test

build:
  stage: build
  script:
    - mvnw.cmd clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar

sca:
  stage: test
  script:
    - mvnw.cmd org.owasp:dependency-check-maven:check -Dformat=HTML -DautoUpdate=false -DoutputDirectory=target/sca
  artifacts:
    when: always
    paths:
      - target/sca/
      - target/dependency-check-report.html